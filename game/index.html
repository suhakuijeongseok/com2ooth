<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 타이밍 배팅</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game-shell">
<section id="selectScreen" class="screen"><div class="eyebrow">KBO PITCH LAB</div><h1>상대 투수를 선택하세요</h1><p class="subtitle">실제 구사율로 구종이 결정되고, 평균 구속에 따라 공이 도착합니다.</p><div id="pitcherGrid" class="pitcher-grid"></div></section>
<section id="gameScreen" class="screen hidden"><header class="topbar"><button id="backButton" class="ghost-button">← 투수 변경</button><div class="pitcher-title"><span id="pitcherName"></span><small id="seasonLabel"></small></div><div class="scoreboard"><span>HIT <strong id="hitCount">0</strong></span><span>MISS <strong id="missCount">0</strong></span><span>BEST <strong id="bestScore">0</strong></span></div></header>
<div class="stadium"><div class="crowd"></div><div class="field"><div class="mound"></div><div class="pitcher-figure"><i class="head"></i><i class="body"></i></div><div class="home-plate"></div><div class="batter"><i class="head"></i><i class="body"></i><i id="bat" class="bat"></i></div><div class="strike-zone"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div id="ball" class="ball hidden"></div><div id="contactBurst" class="contact-burst hidden"></div><div class="timing-track"><div class="sweet-spot"></div><div id="timingNeedle" class="timing-needle"></div></div></div></div>
<section class="control-panel"><div><div id="status" class="status">준비되면 투구를 시작하세요</div><div id="lastPitch" class="last-pitch">SPACE 또는 아래 버튼</div></div><button id="actionButton" class="action-button">투구 시작</button><div id="arsenal" class="arsenal"></div></section></section>
</main><script src="app.js"></script></body></html>
