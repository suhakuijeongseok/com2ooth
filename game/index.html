<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 타이밍 배팅</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game-shell">
<section id="selectScreen" class="select-screen"><header class="select-header"><div class="brand-mark"><span>9</span><b>DIAMOND<br>SHOWDOWN</b></div><div class="season-badge">2026 SEASON</div></header><div class="select-copy"><p>CHOOSE YOUR RIVAL</p><h1>상대 투수 선택</h1><span>실제 구사율과 평균 구속이 매 투구에 반영됩니다.</span></div><div id="pitcherGrid" class="pitcher-grid"></div></section>
<section id="gameScreen" class="game-screen hidden"><div class="stadium-bg"></div><header class="game-hud"><button id="backButton" class="icon-button" aria-label="투수 변경">‹</button><div class="opponent-card"><span class="live-dot"></span><div><small>NOW PITCHING</small><strong id="pitcherName"></strong></div><em id="seasonLabel"></em></div><div class="scoreboard"><div><small>HIT</small><strong id="hitCount">0</strong></div><div><small>MISS</small><strong id="missCount">0</strong></div><div class="best"><small>COMBO</small><strong id="bestScore">0</strong></div></div></header>
<div id="gameStage" class="game-stage"><div class="release-marker"></div><div id="pitcherFigure" class="pitcher-figure"><i class="cap"></i><i class="head"></i><i class="body"></i><i class="arm glove-arm"></i><i class="arm throw-arm"></i><i class="leg left"></i><i class="leg right"></i></div><div class="batter-view"><i class="front-arm"></i><i class="back-arm"></i><i class="hands"></i><i id="bat" class="bat"></i></div><div class="strike-zone"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div id="ball" class="ball hidden"><i class="seam seam-a"></i><i class="seam seam-b"></i></div><div id="contactBurst" class="contact-burst hidden"></div><div id="resultFlash" class="result-flash hidden"><small>TIMING</small><strong></strong><span></span></div></div>
<div class="bottom-hud"><div id="arsenal" class="arsenal"></div><div class="timing-wrap"><span>EARLY</span><div class="timing-track"><div class="sweet-spot"></div><div id="timingNeedle" class="timing-needle"></div></div><span>LATE</span></div><div class="control-panel"><div class="pitch-info"><div id="status" class="status">준비되면 투구를 시작하세요</div><div id="lastPitch" class="last-pitch">SPACE 또는 버튼을 누르세요</div></div><button id="actionButton" class="action-button"><b>투구 시작</b><small>SPACE</small></button></div></div></section>
</main><script src="app.js"></script></body></html>
